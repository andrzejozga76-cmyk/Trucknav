<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14283c"><title>TruckNav – prototyp</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#102133;color:#fff;font-family:system-ui,Arial}header{padding:14px 18px;font-size:21px;font-weight:800}header small{font-size:11px;font-weight:400;color:#bdd0dd}#map{height:52dvh;background:#cdd9d8}.panel{padding:14px;display:grid;gap:10px}label{font-size:13px;color:#d8e7f1}input{width:100%;padding:11px;border:1px solid #71869a;border-radius:9px;background:#fff;color:#102133;font-size:16px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}button{background:#f4b63e;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:700;color:#102133}button.secondary{background:#dce9f0}#status{font-size:13px;line-height:1.4;color:#cbdce8}.warning{font-size:12px;color:#ffd9a0}</style></head><body><header>🚛 TruckNav <small>wersja testowa 0.1</small></header><div id="map" aria-label="Mapa"></div><section class="panel"><button id="locate">📍 Pokaż moją lokalizację</button><div class="fields"><label>Wysokość (m)<input id="height" type="number" step="0.01" min="0" value="4.00"></label><label>Szerokość (m)<input id="width" type="number" step="0.01" min="0" value="2.55"></label><label>Długość (m)<input id="length" type="number" step="0.1" min="0" value="16.5"></label><label>Masa (t)<input id="weight" type="number" step="0.1" min="0" value="40"></label></div><button class="secondary" id="save">Zapisz profil ciężarówki</button><div id="status" role="status">Dotknij mapy, aby wskazać punkt docelowy. Wyznaczanie trasy dodamy w kolejnej wersji.</div><div class="warning">⚠️ Prototyp. Nie wyznacza bezpiecznych tras ciężarowych ani nie sprawdza ograniczeń drogowych. Nie używaj do prowadzenia pojazdu.</div></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([51.033,2.864],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);let destination;map.on('click',e=>{if(destination)map.removeLayer(destination);destination=L.marker(e.latlng).addTo(map).bindPopup('Wybrany punkt docelowy').openPopup();document.getElementById('status').textContent='Cel: '+e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5)+'. Wyznaczanie trasy nie jest jeszcze dostępne.'});document.getElementById('locate').onclick=()=>{const status=document.getElementById('status');if(!navigator.geolocation){status.textContent='Ta przeglądarka nie obsługuje GPS.';return}status.textContent='Pobieram lokalizację…';navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];map.setView(ll,15);L.circleMarker(ll,{radius:9,color:'#fff',fillColor:'#1477ed',fillOpacity:1,weight:3}).addTo(map).bindPopup('Twoja pozycja').openPopup();status.textContent='Lokalizacja pobrana. Dokładność około '+Math.round(p.coords.accuracy)+' m.'},e=>status.textContent='Nie udało się pobrać GPS: '+e.message,{enableHighAccuracy:true,timeout:15000})};const keys=['height','width','length','weight'];try{const v=JSON.parse(localStorage.getItem('trucknav-profile')||'{}');keys.forEach(k=>{if(v[k]!=null)document.getElementById(k).value=v[k]})}catch(e){}document.getElementById('save').onclick=()=>{const p={};for(const k of keys){const n=Number(document.getElementById(k).value);if(!Number.isFinite(n)||n<=0){document.getElementById('status').textContent='Wprowadź poprawną dodatnią wartość: '+k;return}p[k]=n}localStorage.setItem('trucknav-profile',JSON.stringify(p));document.getElementById('status').textContent='Profil zapisany w tej przeglądarce. Parametry nie wpływają jeszcze na trasowanie.'};</script></body></html>
